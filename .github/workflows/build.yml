          ''')

          # 4. Cari Android SDK tools di server GitHub
          sdk_root = os.environ.get("ANDROID_HOME") or "/usr/local/lib/android/sdk"
          platforms = sorted(glob.glob(sdk_root + "/platforms/android-*/android.jar"))
          build_tools = sorted(glob.glob(sdk_root + "/build-tools/*"))
          android_jar = platforms[-1]
          bt_dir = build_tools[-1]
          aapt2 = bt_dir + "/aapt2"
          d8 = bt_dir + "/d8"
          zipalign = bt_dir + "/zipalign"
          apksigner = bt_dir + "/apksigner"

          # 5. Compile Resources dengan AAPT2
          subprocess.run([aapt2, "compile", "--dir", "build_work/res", "-o", "build_work/res.zip"], check=True)
          os.makedirs("build_work/gen", exist_ok=True)
          subprocess.run([
              aapt2, "link", "-I", android_jar,
              "--manifest", "build_work/AndroidManifest.xml",
              "-o", "build_work/unaligned.apk",
              "--java", "build_work/gen",
              "build_work/res.zip"
          ], check=True)

          # 6. Compile semua file Java dengan JAVAC
          os.makedirs("build_work/classes", exist_ok=True)
          java_files = glob.glob("build_work/src/**/*.java", recursive=True) + glob.glob("build_work/gen/**/*.java", recursive=True)
          subprocess.run([
              "javac", "-source", "1.8", "-target", "1.8",
              "-bootclasspath", android_jar,
              "-classpath", android_jar,
              "-d", "build_work/classes"
          ] + java_files, check=True)

          # 7. Ubah .class menjadi classes.dex dengan D8
          class_files = glob.glob("build_work/classes/**/*.class", recursive=True)
          subprocess.run([d8, "--lib", android_jar, "--output", "build_work"] + class_files, check=True)

          # 8. Masukkan classes.dex ke dalam APK
          with zipfile.ZipFile("build_work/unaligned.apk", "a") as zf:
              zf.write("build_work/classes.dex", "classes.dex")

          # 9. Zipalign & Sign APK
          subprocess.run([zipalign, "-p", "-f", "4", "build_work/unaligned.apk", "build_work/aligned.apk"], check=True)
          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", "build_work/debug.keystore",
              "-storepass", "android", "-keypass", "android",
              "-alias", "androiddebugkey",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-dname", "CN=Android Debug,O=Android,C=US"
          ], check=True)
          out_apk = "app/build/outputs/apk/debug/KALYVRA-TOOLS.apk"
          subprocess.run([
              apksigner, "sign",
              "--ks", "build_work/debug.keystore",
              "--ks-pass", "pass:android",
              "--key-pass", "pass:android",
              "--out", out_apk,
              "build_work/aligned.apk"
          ], check=True)
          print("SUCCESS:", out_apk)
