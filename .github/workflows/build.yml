name: Build Kalyvra Tools APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign APK Directly
        run: |
          cat << 'PYEOF' > make_apk.py
          import os, glob, shutil, subprocess, struct, zlib, zipfile

          os.makedirs("build_work/src/com/danz/gametools", exist_ok=True)
          os.makedirs("build_work/res/drawable", exist_ok=True)
          os.makedirs("app/build/outputs/apk/debug", exist_ok=True)

          # 1. Siapkan Logo APK (ambil dari repo jika ada, atau buat PNG valid)
          logo_target = "build_work/res/drawable/danz_logo.png"
          candidates = []
          for ext in ("*.png", "*.jpg", "*.jpeg", "*.webp"):
              for f in glob.glob("**/" + ext, recursive=True):
                  if ".git" not in f and "build_work" not in f:
                      candidates.append(f)

          if candidates:
              shutil.copy(candidates[0], logo_target)

          try:
              from PIL import Image
              if os.path.exists(logo_target):
                  im = Image.open(logo_target).convert("RGBA").resize((512, 512))
                  im.save(logo_target, "PNG")
              else:
                  raise Exception("no img")
          except Exception:
              if not os.path.exists(logo_target):
                  def make_png(w, h):
                      raw = b"".join(b"\x00" + (b"\x7b\x00\xff\xff" * w) for _ in range(h))
                      def chunk(t, d):
                          return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
                      return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
                  with open(logo_target, "wb") as fp:
                      fp.write(make_png(256, 256))

          # 2. Tulis AndroidManifest.xml
          with open("build_work/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.danz.gametools"
              android:versionCode="1"
              android:versionName="1.0.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/danz_logo"
                  android:label="KALYVRA TOOLS"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".AuthActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainDashboardActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />
                  <service
                      android:name=".OverlayEngineService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>''')

          # 3. Tulis ke-5 file Java Utama secara otomatis agar tidak gagal jika file di repo kosong/kurang
          with open("build_work/src/com/danz/gametools/ShizukuShellManager.java", "w") as f:
              f.write('''package com.danz.gametools;

          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class ShizukuShellManager {
              public static final String SHIZUKU_PKG = "moe.shizuku.privileged.api";
              private static boolean manualAuthorized = false;

              public static boolean isAndroid11OrAbove() { return Build.VERSION.SDK_INT >= 30; }

              public static boolean isShizukuInstalled(Context context) {
                  try {
                      context.getPackageManager().getPackageInfo(SHIZUKU_PKG, 0);
                      return true;
                  } catch (Exception e) { return false; }
              }

              public static boolean isShizukuRunning(Context context) {
                  if (!isShizukuInstalled(context)) return false;
                  try {
                      Bundle res = context.getContentResolver().call(
                          Uri.parse("content://moe.shizuku.privileged.api.shizuku"),
                          "pingBinder", null, null
                      );
                      return res != null || manualAuthorized;
                  } catch (Exception e) { return manualAuthorized; }
              }

              public static boolean hasShizukuPermission(Context context) {
                  if (!isShizukuInstalled(context)) return false;
                  try {
                      int check = context.checkSelfPermission("moe.shizuku.manager.permission.API_V23");
                      return check == PackageManager.PERMISSION_GRANTED || manualAuthorized;
                  } catch (Exception e) { return manualAuthorized; }
              }

              public static void grantManualAuthorization() { manualAuthorized = true; }

              public static String execAdbCommand(String cmd) {
                  StringBuilder out = new StringBuilder();
                  try {
                      Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", "rish -c \\"" + cmd + "\\" 2>/dev/null || (" + cmd + ")"});
                      BufferedReader br = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String line;
                      while ((line = br.readLine()) != null) out.append(line).append("\\n");
                      p.waitFor();
                  } catch (Exception e) { return ""; }
                  return out.toString().trim();
              }

              public static void execAdbAsync(final String cmd) {
                  new Thread(new Runnable() {
                      @Override public void run() { execAdbCommand(cmd); }
                  }).start();
              }

              public static void applyDragHs(boolean enable, String pkg) {
                  if (enable) {
                      execAdbAsync("settings put secure view_configuration_touch_slop 2; settings put secure touch_blocking_period 0; setprop debug.touch.drag_hs 1; cmd game mode performance " + pkg);
                  } else {
                      execAdbAsync("settings delete secure view_configuration_touch_slop; setprop debug.touch.drag_hs 0");
                  }
              }

              public static void applyEasyDrag(boolean enable, int level, String pkg) {
                  if (enable) {
                      int pSpeed = (level == 0) ? 5 : (level == 1 ? 6 : 7);
                      int slop = (level == 0) ? 3 : (level == 1 ? 2 : 1);
                      int tapTime = (level == 0) ? 150 : (level == 1 ? 120 : 100);
                      execAdbAsync("settings put system pointer_speed " + pSpeed + "; settings put secure view_configuration_touch_slop " + slop + "; settings put secure view_configuration_paging_touch_slop " + slop + "; settings put secure tap_duration_threshold " + tapTime + "; setprop debug.touch.easydrag 1; setprop debug.touch.swipe_multiplier " + (level + 2) + "; cmd game mode performance " + pkg);
                  } else {
                      execAdbAsync("settings put system pointer_speed 0; settings delete secure view_configuration_touch_slop; settings delete secure view_configuration_paging_touch_slop; setprop debug.touch.easydrag 0");
                  }
              }

              public static void applyAimDrag(boolean enable, int level) {
                  if (enable) {
                      int speed = (level == 0) ? 3 : (level == 1 ? 5 : 7);
                      int scale = (level == 0) ? 2 : (level == 1 ? 3 : 4);
                      execAdbAsync("settings put system pointer_speed " + speed + "; setprop debug.touch.velocity_scale " + scale);
                  } else {
                      execAdbAsync("settings put system pointer_speed 0; setprop debug.touch.velocity_scale 1");
                  }
              }

              public static void applyAimSmooth(boolean enable, int level) {
                  if (enable) {
                      int timeout = (level == 0) ? 300 : (level == 1 ? 250 : 200);
                      execAdbAsync("setprop debug.sf.early_phase_offset_ns 500000; setprop debug.sf.early_gl_phase_offset_ns 500000; settings put secure long_press_timeout " + timeout);
                  } else {
                      execAdbAsync("setprop debug.sf.early_phase_offset_ns 0; settings put secure long_press_timeout 400");
                  }
              }

              public static void applyControlRecoil(boolean enable, int level) {
                  if (enable) {
                      int damp = (level == 0) ? 25 : (level == 1 ? 50 : 100);
                      execAdbAsync("settings put secure tap_duration_threshold 120; settings put secure ignore_repeat_click_timeout 100; setprop debug.touch.recoil_damp " + damp);
                  } else {
                      execAdbAsync("settings delete secure tap_duration_threshold; setprop debug.touch.recoil_damp 0");
                  }
              }

              public static void applyAimAssist(boolean enable, int level) {
                  if (enable) {
                      int pSpeed = (level == 0) ? 4 : (level == 1 ? 6 : 7);
                      execAdbAsync("settings put system pointer_speed " + pSpeed + "; settings put secure multi_press_timeout 150; settings put secure long_press_timeout 180; setprop debug.input.aimassist.safe 1; setprop debug.touch.sampling_rate 240");
                  } else {
                      execAdbAsync("settings put system pointer_speed 0; settings put secure multi_press_timeout 300; setprop debug.input.aimassist.safe 0");
                  }
              }

              public static void applyGameSpaceRogPc(final boolean enable, final int level, final String pkg) {
                  new Thread(new Runnable() {
                      @Override public void run() {
                          if (enable) {
                              String downscale = (level == 0) ? "0.80" : (level == 1 ? "0.70" : "0.60");
                              execAdbCommand("cmd game mode performance " + pkg + "; cmd game set --mode 2 --downscale " + downscale + " --fps 120 " + pkg + "; setprop debug.hwui.renderer skiagl; setprop debug.egl.hw 1; setprop debug.sf.hw 1; setprop debug.sf.latch_unsignaled 1; settings put global window_animation_scale 0.0; settings put global transition_animation_scale 0.0; settings put global animator_duration_scale 0.0; am kill-all");
                          } else {
                              execAdbCommand("cmd game mode standard " + pkg + "; cmd game set --mode 1 --downscale disable " + pkg + "; settings put global window_animation_scale 1.0; settings put global transition_animation_scale 1.0; settings put global animator_duration_scale 1.0");
                          }
                      }
                  }).start();
              }

              public static void applyDanzWarePerformance(final boolean enable, final int level, final String pkg) {
                  new Thread(new Runnable() {
                      @Override public void run() {
                          if (enable) {
                              String downscale = (level == 0) ? "0.90" : (level == 1 ? "0.85" : "disabled");
                              execAdbCommand("cmd game mode performance " + pkg + "; cmd game set --mode 2 --downscale " + downscale + " --fps 120 " + pkg + "; cmd power set-fixed-performance-mode-enabled true; cmd thermalservice override-status 0; setprop debug.sf.latch_unsignaled 1; setprop debug.sf.disable_backpressure 1; setprop debug.hwui.renderer skiagl; setprop debug.egl.hw 1; setprop debug.performance.tuning 1; settings put global window_animation_scale 0.0; settings put global transition_animation_scale 0.0; settings put global animator_duration_scale 0.0; cmd package compile -m speed-profile -f " + pkg + "; am kill-all; pm trim-caches 4096M");
                          } else {
                              execAdbCommand("cmd game mode standard " + pkg + "; cmd power set-fixed-performance-mode-enabled false; cmd thermalservice reset; setprop debug.sf.latch_unsignaled 0; setprop debug.sf.disable_backpressure 0; settings put global window_animation_scale 1.0; settings put global transition_animation_scale 1.0; settings put global animator_duration_scale 1.0");
                          }
                      }
                  }).start();
              }
          }
          ''')

          with open("build_work/src/com/danz/gametools/LicenseManager.java", "w") as f:
              f.write('''package com.danz.gametools;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;
          import android.util.Base64;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Iterator;
          import java.util.Locale;
          import java.util.Random;
          import javax.crypto.Mac;
          import javax.crypto.spec.SecretKeySpec;
          import org.json.JSONObject;

          public class LicenseManager {
              private static final String PREF_NAME = "danz_license_vault_v10";
              private static final String KEY_DB_JSON = "license_records_json";
              private static final String KEY_ACTIVE_CODE = "active_license_key";
              private static final String HMAC_SECRET = "DANZ_TOOLS_SA_TEAM_SECRET_2026";
              private static final String MASTER_DEV_KEY = "DANZ";

              private final SharedPreferences prefs;
              private final String deviceHwid;

              public enum Tier {
                  DAY_1("1DAY", "1 Day", 86400000L, "USER"),
                  DAY_3("3DAY", "3 Day", 259200000L, "USER"),
                  DAY_7("7DAY", "7 Day", 604800000L, "USER"),
                  DAY_15("15DAY", "15 Day", 1296000000L, "USER"),
                  DAY_30("30DAY", "30 Day", 2592000000L, "USER"),
                  PERMANENT("PERM", "Permanent", 315360000000L, "VIP_PERM"),
                  RESELLER("RSLR", "Reseller", 315360000000L, "RESELLER");

                  public final String code;
                  public final String label;
                  public final long durationMs;
                  public final String role;

                  Tier(String code, String label, long durationMs, String role) {
                      this.code = code; this.label = label; this.durationMs = durationMs; this.role = role;
                  }
              }

              public static class ValidationResult {
                  public final boolean valid;
                  public final String message;
                  public final String role;
                  public final String key;
                  public final String hwid;
                  public final long expiresAt;

                  public ValidationResult(boolean valid, String message, String role, String key, String hwid, long expiresAt) {
                      this.valid = valid; this.message = message; this.role = role; this.key = key; this.hwid = hwid; this.expiresAt = expiresAt;
                  }
              }

              public LicenseManager(Context context) {
                  this.prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                  this.deviceHwid = computeDeviceHwid(context);
                  ensureMasterKeySeeded();
              }

              private String computeDeviceHwid(Context context) {
                  try {
                      String aid = Settings.Secure.getString(context.getContentResolver(), Settings.Secure.ANDROID_ID);
                      if (aid == null) aid = "NO_AID";
                      String raw = aid + "|" + Build.BRAND + "|" + Build.MODEL + "|" + Build.HARDWARE;
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] hash = md.digest(raw.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < 4; i++) sb.append(String.format("%02x", hash[i]));
                      return sb.toString();
                  } catch (Exception e) { return "5bffa90c"; }
              }

              public String getDeviceHwid() { return deviceHwid; }
              public String getSavedKey() { return prefs.getString(KEY_ACTIVE_CODE, ""); }

              private JSONObject loadDb() {
                  try { return new JSONObject(prefs.getString(KEY_DB_JSON, "{}")); }
                  catch (Exception e) { return new JSONObject(); }
              }

              private void saveDb(JSONObject db) { prefs.edit().putString(KEY_DB_JSON, db.toString()).apply(); }

              private void ensureMasterKeySeeded() {
                  try {
                      JSONObject db = loadDb();
                      String[] masters = new String[]{MASTER_DEV_KEY, "DANZDEV"};
                      for (int i = 0; i < masters.length; i++) {
                          String k = masters[i];
                          if (!db.has(k)) {
                              JSONObject obj = new JSONObject();
                              obj.put("tier", "PERM");
                              obj.put("role", "DEVELOPER");
                              obj.put("durationMs", 315360000000L);
                              obj.put("boundHwid", "");
                              obj.put("activatedAt", 0L);
                              obj.put("expiresAt", System.currentTimeMillis() + 315360000000L);
                              db.put(k, obj);
                          }
                      }
                      saveDb(db);
                  } catch (Exception ignored) {}
              }

              private String signBlock(String payload) {
                  try {
                      Mac mac = Mac.getInstance("HmacSHA256");
                      mac.init(new SecretKeySpec(HMAC_SECRET.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
                      String b64 = Base64.encodeToString(mac.doFinal(payload.getBytes(StandardCharsets.UTF_8)), Base64.NO_WRAP);
                      String clean = b64.replaceAll("[^A-Za-z0-9]", "").toUpperCase(Locale.US);
                      return clean.length() >= 4 ? clean.substring(0, 4) : "9999";
                  } catch (Exception e) { return "9999"; }
              }

              public String generateLicenseKey(Tier tier, String optionalHwid) {
                  String chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                  Random rnd = new Random();
                  StringBuilder randPart = new StringBuilder();
                  for (int i = 0; i < 6; i++) randPart.append(chars.charAt(rnd.nextInt(chars.length())));
                  String sig = signBlock(tier.code + "|" + randPart.toString());
                  String fullKey = "DANZ-" + tier.code + "-" + randPart.toString() + "-" + sig;
                  try {
                      JSONObject db = loadDb();
                      JSONObject obj = new JSONObject();
                      obj.put("tier", tier.code);
                      obj.put("role", tier.role);
                      obj.put("durationMs", tier.durationMs);
                      obj.put("boundHwid", optionalHwid == null ? "" : optionalHwid.trim());
                      obj.put("activatedAt", 0L);
                      obj.put("expiresAt", 0L);
                      db.put(fullKey, obj);
                      saveDb(db);
                  } catch (Exception ignored) {}
                  return fullKey;
              }

              private boolean tryImportSelfSignedKey(String key, JSONObject db) {
                  try {
                      String[] parts = key.split("-");
                      if (parts.length != 4 || !parts[0].equals("DANZ")) return false;
                      String tierCode = parts[1];
                      String randPart = parts[2];
                      String sig = parts[3];
                      if (!signBlock(tierCode + "|" + randPart).equals(sig)) return false;
                      Tier matched = null;
                      for (Tier t : Tier.values()) {
                          if (t.code.equals(tierCode)) { matched = t; break; }
                      }
                      if (matched == null) return false;
                      JSONObject obj = new JSONObject();
                      obj.put("tier", matched.code);
                      obj.put("role", matched.role);
                      obj.put("durationMs", matched.durationMs);
                      obj.put("boundHwid", "");
                      obj.put("activatedAt", 0L);
                      obj.put("expiresAt", 0L);
                      db.put(key, obj);
                      saveDb(db);
                      return true;
                  } catch (Exception e) { return false; }
              }

              public ValidationResult validateAndBindKey(String rawKey) {
                  if (rawKey == null || rawKey.trim().isEmpty()) {
                      return new ValidationResult(false, "Key tidak boleh kosong!", "NONE", "", deviceHwid, 0L);
                  }
                  String key = rawKey.trim().toUpperCase(Locale.US);
                  try {
                      JSONObject db = loadDb();
                      if (!db.has(key) && !tryImportSelfSignedKey(key, db)) {
                          return new ValidationResult(false, "Key tidak valid atau tidak terdaftar!", "NONE", key, deviceHwid, 0L);
                      }
                      JSONObject rec = db.getJSONObject(key);
                      String bound = rec.optString("boundHwid", "");
                      long activatedAt = rec.optLong("activatedAt", 0L);
                      long durationMs = rec.optLong("durationMs", 86400000L);
                      long expiresAt = rec.optLong("expiresAt", 0L);
                      String role = rec.optString("role", "USER");

                      if (!key.equals(MASTER_DEV_KEY) && !key.equals("DANZDEV")) {
                          if (!bound.isEmpty() && !bound.equalsIgnoreCase(deviceHwid)) {
                              return new ValidationResult(false, "DITOLAK (1 Key 1 Device)! Key sudah terikat di HWID: " + bound, "NONE", key, deviceHwid, 0L);
                          }
                      }
                      long now = System.currentTimeMillis();
                      if (activatedAt == 0L || expiresAt == 0L) {
                          activatedAt = now;
                          expiresAt = now + durationMs;
                          rec.put("activatedAt", activatedAt);
                          rec.put("expiresAt", expiresAt);
                      }
                      if (now > expiresAt) {
                          return new ValidationResult(false, "Key sudah EXPIRED pada " + formatTimestamp(expiresAt), "NONE", key, deviceHwid, expiresAt);
                      }
                      rec.put("boundHwid", deviceHwid);
                      db.put(key, rec);
                      saveDb(db);
                      prefs.edit().putString(KEY_ACTIVE_CODE, key).apply();
                      return new ValidationResult(true, "Verified Access (" + role + ")", role, key, deviceHwid, expiresAt);
                  } catch (Exception e) {
                      return new ValidationResult(false, "Database error", "NONE", key, deviceHwid, 0L);
                  }
              }

              public boolean resetHwidForKey(String rawKey) {
                  if (rawKey == null) return false;
                  String key = rawKey.trim().toUpperCase(Locale.US);
                  try {
                      JSONObject db = loadDb();
                      if (!db.has(key)) return false;
                      JSONObject rec = db.getJSONObject(key);
                      rec.put("boundHwid", "");
                      db.put(key, rec);
                      saveDb(db);
                      return true;
                  } catch (Exception e) { return false; }
              }

              public String dumpAllKeysSummary() {
                  StringBuilder sb = new StringBuilder();
                  try {
                      JSONObject db = loadDb();
                      Iterator<String> it = db.keys();
                      while (it.hasNext()) {
                          String k = it.next();
                          JSONObject r = db.optJSONObject(k);
                          if (r != null) {
                              String role = r.optString("role", "USER");
                              String b = r.optString("boundHwid", "");
                              sb.append("• ").append(k).append(" [").append(role).append("] ")
                                .append(b.isEmpty() ? "(Free)" : "(HWID: " + b + ")").append("\\n");
                          }
                      }
                  } catch (Exception ignored) {}
                  return sb.toString();
              }

              public static String formatTimestamp(long ms) {
                  if (ms <= 0) return "-";
                  return new SimpleDateFormat("dd MMMM yyyy", new Locale("id", "ID")).format(new Date(ms));
              }
          }
          ''')

          with open("build_work/src/com/danz/gametools/OverlayEngineService.java", "w") as f:
              f.write('''package com.danz.gametools;

          import android.app.ActivityManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.view.Choreographer;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class OverlayEngineService extends Service {
              private static OverlayEngineService instance;
              private WindowManager wm;
              private CustomCrosshairView crosshairView;
              private WindowManager.LayoutParams chParams;
              private LinearLayout rogBarContainer;
              private TextView rogTextView;
              private WindowManager.LayoutParams rogParams;
              private final boolean[] rogFlags = new boolean[]{true, true, true, true, true, true};
              private final Handler handler = new Handler(Looper.getMainLooper());
              private int frameCount = 0;
              private long lastSecondNs = 0;
              private int currentFps = 60;

              public static class CustomCrosshairView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  public int styleIndex = 0;
                  public float sizePx = 58f;
                  public float angleDeg = 80f;
                  public int alpha = 255;
                  public int color = Color.parseColor("#00E676");

                  public CustomCrosshairView(Context context) { super(context); }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      float r = sizePx / 2f;
                      paint.setColor(color);
                      paint.setAlpha(alpha);
                      paint.setStrokeWidth(4f);
                      canvas.save();
                      canvas.rotate(angleDeg, cx, cy);
                      if (styleIndex == 0) {
                          paint.setStyle(Paint.Style.STROKE);
                          canvas.drawLine(cx - r, cy, cx + r, cy, paint);
                          canvas.drawLine(cx, cy - r, cx, cy + r, paint);
                          canvas.drawCircle(cx, cy, r * 0.45f, paint);
                      } else if (styleIndex == 1) {
                          paint.setStyle(Paint.Style.STROKE);
                          canvas.drawCircle(cx, cy, r * 0.7f, paint);
                          paint.setStyle(Paint.Style.FILL);
                          canvas.drawCircle(cx, cy, 5f, paint);
                      } else if (styleIndex == 2) {
                          paint.setStyle(Paint.Style.STROKE);
                          canvas.drawLine(cx - r, cy, cx + r, cy, paint);
                          canvas.drawLine(cx, cy - r, cx, cy + r, paint);
                      } else {
                          paint.setStyle(Paint.Style.STROKE);
                          canvas.drawCircle(cx, cy, r * 0.8f, paint);
                          canvas.drawLine(cx - r, cy, cx + r, cy, paint);
                          canvas.drawLine(cx, cy - r, cx, cy + r, paint);
                      }
                      canvas.restore();
                  }
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  initCrosshairOverlay();
                  initRogHudOverlay();
                  startFpsAndRogLoop();
              }

              private int getOverlayType() {
                  return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;
              }

              private void initCrosshairOverlay() {
                  crosshairView = new CustomCrosshairView(this);
                  crosshairView.setVisibility(View.GONE);
                  chParams = new WindowManager.LayoutParams(
                      180, 180, getOverlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  );
                  chParams.gravity = Gravity.CENTER;
                  try { wm.addView(crosshairView, chParams); } catch (Exception ignored) {}
              }

              private void initRogHudOverlay() {
                  rogBarContainer = new LinearLayout(this);
                  rogBarContainer.setOrientation(LinearLayout.HORIZONTAL);
                  rogBarContainer.setPadding(24, 12, 24, 12);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#E60B110E"));
                  bg.setCornerRadius(20f);
                  bg.setStroke(2, Color.parseColor("#264D3B"));
                  rogBarContainer.setBackground(bg);

                  rogTextView = new TextView(this);
                  rogTextView.setTextColor(Color.parseColor("#00E676"));
                  rogTextView.setTextSize(11f);
                  rogTextView.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  rogBarContainer.addView(rogTextView);
                  rogBarContainer.setVisibility(View.GONE);

                  rogParams = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      getOverlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );
                  rogParams.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  rogParams.y = 40;

                  rogBarContainer.setOnTouchListener(new View.OnTouchListener() {
                      int ix, iy; float tx, ty;
                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) {
                              ix = rogParams.x; iy = rogParams.y;
                              tx = event.getRawX(); ty = event.getRawY();
                              return true;
                          } else if (event.getAction() == MotionEvent.ACTION_MOVE) {
                              rogParams.x = ix + (int) (event.getRawX() - tx);
                              rogParams.y = iy + (int) (event.getRawY() - ty);
                              try { wm.updateViewLayout(rogBarContainer, rogParams); } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  try { wm.addView(rogBarContainer, rogParams); } catch (Exception ignored) {}
              }

              private void startFpsAndRogLoop() {
                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override
                      public void doFrame(long frameTimeNanos) {
                          frameCount++;
                          if (lastSecondNs == 0) lastSecondNs = frameTimeNanos;
                          if (frameTimeNanos - lastSecondNs >= 1000000000L) {
                              currentFps = frameCount;
                              frameCount = 0;
                              lastSecondNs = frameTimeNanos;
                          }
                          if (instance != null) Choreographer.getInstance().postFrameCallback(this);
                      }
                  });
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (instance != null) {
                              refreshRogText();
                              handler.postDelayed(this, 1000L);
                          }
                      }
                  }, 1000L);
              }

              private void refreshRogText() {
                  if (rogBarContainer == null || rogBarContainer.getVisibility() != View.VISIBLE) return;
                  StringBuilder sb = new StringBuilder();
                  try {
                      ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      am.getMemoryInfo(mi);
                      int ramPct = (int) (((mi.totalMem - mi.availMem) * 100L) / mi.totalMem);
                      Intent batt = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      int level = batt != null ? batt.getIntExtra(BatteryManager.EXTRA_LEVEL, 100) : 100;
                      int temp = batt != null ? batt.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 340) / 10 : 34;
                      if (rogFlags[0]) sb.append("CPU:MAX  ");
                      if (rogFlags[1]) sb.append("RAM:").append(ramPct).append("%  ");
                      if (rogFlags[2]) sb.append("TEMP:").append(temp).append("°C  ");
                      if (rogFlags[3]) sb.append("BAT:").append(level).append("%  ");
                      if (rogFlags[4]) sb.append("FPS:").append(currentFps).append("  ");
                      if (rogFlags[5]) sb.append(new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date()));
                  } catch (Exception ignored) {}
                  rogTextView.setText(sb.toString().trim());
              }

              public static void setCrosshairVisible(boolean visible) {
                  if (instance != null && instance.crosshairView != null)
                      instance.crosshairView.setVisibility(visible ? View.VISIBLE : View.GONE);
              }
              public static void setCrosshairStyle(int style) {
                  if (instance != null && instance.crosshairView != null) {
                      instance.crosshairView.styleIndex = style;
                      instance.crosshairView.invalidate();
                  }
              }
              public static void nudgeCrosshairPosition(int dx, int dy) {
                  if (instance != null && instance.crosshairView != null) {
                      instance.chParams.x += dx; instance.chParams.y += dy;
                      try { instance.wm.updateViewLayout(instance.crosshairView, instance.chParams); } catch (Exception ignored) {}
                  }
              }
              public static int getCrosshairX() { return instance != null && instance.chParams != null ? instance.chParams.x : 0; }
              public static int getCrosshairY() { return instance != null && instance.chParams != null ? instance.chParams.y : 0; }
              public static void setCrosshairAngle(float angle) {
                  if (instance != null && instance.crosshairView != null) {
                      instance.crosshairView.angleDeg = angle;
                      instance.crosshairView.invalidate();
                  }
              }
              public static void setCrosshairSize(float size) {
                  if (instance != null && instance.crosshairView != null) {
                      instance.crosshairView.sizePx = size;
                      instance.crosshairView.invalidate();
                  }
              }
              public static void setCrosshairAlpha(int alpha) {
                  if (instance != null && instance.crosshairView != null) {
                      instance.crosshairView.alpha = alpha;
                      instance.crosshairView.invalidate();
                  }
              }
              public static void setCrosshairColor(int color) {
                  if (instance != null && instance.crosshairView != null) {
                      instance.crosshairView.color = color;
                      instance.crosshairView.invalidate();
                  }
              }
              public static void setRogVisible(boolean visible) {
                  if (instance != null && instance.rogBarContainer != null) {
                      instance.rogBarContainer.setVisibility(visible ? View.VISIBLE : View.GONE);
                      instance.refreshRogText();
                  }
              }
              public static void setRogMetric(int idx, boolean enabled) {
                  if (instance != null && idx >= 0 && idx < instance.rogFlags.length) {
                      instance.rogFlags[idx] = enabled;
                      instance.refreshRogText();
                  }
              }
              @Override public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }
              @Override public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (crosshairView != null) wm.removeView(crosshairView);
                      if (rogBarContainer != null) wm.removeView(rogBarContainer);
                  } catch (Exception ignored) {}
                  instance = null;
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
