name: Build Kalyvra Tools APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile & Sign KALYVRA TOOLS APK (Direct Android SDK)
        run: python3 -c '
import os, glob, shutil, subprocess, struct, zlib

os.makedirs("build_work/src/com/danz/gametools", exist_ok=True)
os.makedirs("build_work/res/drawable", exist_ok=True)
os.makedirs("app/build/outputs/apk/debug", exist_ok=True)

# 1. Siapkan Logo APK (ambil dari repo jika ada, atau konversi ke PNG valid)
logo_target = "build_work/res/drawable/danz_logo.png"
candidates = []
for ext in ("*.png", "*.jpg", "*.jpeg", "*.webp"):
    for f in glob.glob("**/" + ext, recursive=True):
        if ".git" not in f and "build_work" not in f:
            candidates.append(f)

if candidates:
    shutil.copy(candidates[0], logo_target)

try:
    from PIL import Image
    if os.path.exists(logo_target):
        im = Image.open(logo_target).convert("RGBA").resize((512, 512))
        im.save(logo_target, "PNG")
    else:
        raise Exception("no img")
except Exception:
    if not os.path.exists(logo_target):
        def make_png(w, h):
            raw = b"".join(b"\x00" + (b"\x7b\x00\xff\xff" * w) for _ in range(h))
            def chunk(t, d):
                return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
            return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
        with open(logo_target, "wb") as fp:
            fp.write(make_png(256, 256))

# 2. Tulis AndroidManifest.xml
manifest_xml = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.danz.gametools"
    android:versionCode="1"
    android:versionName="1.0.0">

    <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
    <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

    <application
        android:allowBackup="true"
        android:icon="@drawable/danz_logo"
        android:label="KALYVRA TOOLS"
        android:supportsRtl="true"
        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

        <activity
            android:name=".AuthActivity"
            android:exported="true"
            android:screenOrientation="portrait">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

        <activity
            android:name=".MainDashboardActivity"
            android:exported="false"
            android:screenOrientation="portrait" />

        <service
            android:name=".OverlayEngineService"
            android:enabled="true"
            android:exported="false" />
    </application>
</manifest>"""

with open("build_work/AndroidManifest.xml", "w") as f:
    f.write(manifest_xml)

# 3. Salin file .java dari repo kamu ke build_work/src/com/danz/gametools/
for jf in glob.glob("**/*.java", recursive=True):
    if "build_work" not in jf:
        base = os.path.basename(jf)
        if base.endswith(".java.java"):
            base = base[:-5]
        with open(jf, "r", errors="ignore") as srcf:
            code = srcf.read()
        code = code.replace("package com.sateam.danzinject;", "package com.danz.gametools;")
        with open("build_work/src/com/danz/gametools/" + base, "w") as dstf:
            dstf.write(code)

# 4. Cari Android SDK tools (aapt2, d8, apksigner, android.jar) di server GitHub
sdk_root = os.environ.get("ANDROID_HOME") or "/usr/local/lib/android/sdk"
platforms = sorted(glob.glob(sdk_root + "/platforms/android-*/android.jar"))
build_tools = sorted(glob.glob(sdk_root + "/build-tools/*"))
android_jar = platforms[-1]
bt_dir = build_tools[-1]
aapt2 = bt_dir + "/aapt2"
d8 = bt_dir + "/d8"
zipalign = bt_dir + "/zipalign"
apksigner = bt_dir + "/apksigner"

print("Using android.jar:", android_jar)
print("Using build-tools:", bt_dir)

# 5. Compile Resources dengan AAPT2
subprocess.run([aapt2, "compile", "--dir", "build_work/res", "-o", "build_work/res.zip"], check=True)
os.makedirs("build_work/gen", exist_ok=True)
subprocess.run([
    aapt2, "link",
    "-I", android_jar,
    "--manifest", "build_work/AndroidManifest.xml",
    "-o", "build_work/unaligned.apk",
    "--java", "build_work/gen",
    "build_work/res.zip"
], check=True)

# 6. Compile semua file Java dengan JAVAC
os.makedirs("build_work/classes", exist_ok=True)
java_files = glob.glob("build_work/src/**/*.java", recursive=True) + glob.glob("build_work/gen/**/*.java", recursive=True)
subprocess.run([
    "javac", "-source", "1.8", "-target", "1.8",
    "-bootclasspath", android_jar,
    "-classpath", android_jar,
    "-d", "build_work/classes"
] + java_files, check=True)

# 7. Ubah .class menjadi classes.dex dengan D8
class_files = glob.glob("build_work/classes/**/*.class", recursive=True)
subprocess.run([d8, "--lib", android_jar, "--output", "build_work"] + class_files, check=True)

# 8. Masukkan classes.dex ke dalam APK
import zipfile
with zipfile.ZipFile("build_work/unaligned.apk", "a") as zf:
    zf.write("build_work/classes.dex", "classes.dex")

# 9. Zipalign & Sign APK agar siap di-install di semua HP Android
subprocess.run([zipalign, "-p", "-f", "4", "build_work/unaligned.apk", "build_work/aligned.apk"], check=True)
subprocess.run([
    "keytool", "-genkeypair", "-v",
    "-keystore", "build_work/debug.keystore",
    "-storepass", "android", "-keypass", "android",
    "-alias", "androiddebugkey",
    "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
    "-dname", "CN=Android Debug,O=Android,C=US"
], check=True)
out_apk = "app/build/outputs/apk/debug/KALYVRA-TOOLS.apk"
subprocess.run([
    apksigner, "sign",
    "--ks", "build_work/debug.keystore",
    "--ks-pass", "pass:android",
    "--key-pass", "pass:android",
    "--out", out_apk,
    "build_work/aligned.apk"
], check=True)
print("APK SUCCESSFULLY BUILT:", out_apk)
'

      - name: Upload APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: KALYVRA-TOOLS-APK
          path: app/build/outputs/apk/debug/KALYVRA-TOOLS.apk
